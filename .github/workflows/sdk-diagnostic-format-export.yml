# Temporary formatting export; removed immediately after applying formatter output.
name: SDK diagnostic format export
on:
  push:
    branches: ['feature/ui-sdk-*']
permissions:
  contents: read
jobs:
  formatter:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install formatter
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-format-18
      - name: Format diagnostic sources
        run: |
          clang-format-18 -i src/sdk/diagnostic_export.hpp src/sdk/sdk.hpp tests/unit/sdk_diagnostic_export_test.cpp examples/sdk-consumer/main.cpp
      - name: Export exact formatted sources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, subprocess
          for file in subprocess.check_output(['git','diff','--name-only'],text=True).splitlines():
              encoded=base64.b64encode(Path(file).read_bytes()).decode('ascii')
              for n,start in enumerate(range(0,len(encoded),1500)):
                  print(f'HUIFMT|{file}|{n}|{encoded[start:start+1500]}',flush=True)
              print(f'HUIEND|{file}|{len(encoded)}',flush=True)
          PY
