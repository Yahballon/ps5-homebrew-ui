# Temporary formatter export; removed after clang-format-18 output applied.
name: SDK v061 format export
on:
  push:
    branches: ['feature/ui-sdk-*']
permissions:
  contents: read
jobs:
  formatter:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install clang-format 18
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-format-18
      - name: Format v0.6.1 sources
        run: |
          clang-format-18 -i examples/sdk-consumer/main.cpp src/sdk/worker_thread.hpp tests/unit/sdk_soak_test.cpp tests/unit/sdk_lifecycle_test.cpp
      - name: Export changed source
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          import subprocess
          files = subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          for filename in files:
              encoded = base64.b64encode(Path(filename).read_bytes()).decode('ascii')
              for i,start in enumerate(range(0,len(encoded),1500)):
                  print(f'HUIFMT|{filename}|{i}|{encoded[start:start+1500]}', flush=True)
              print(f'HUIEND|{filename}|{len(encoded)}', flush=True)
          print(f'HUIFILES={len(files)}')
          PY
