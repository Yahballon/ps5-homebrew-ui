# Temporary read-only code export, removed after applying clang-format-18.
name: SDK v06 format export
on:
  push:
    branches: ['feature/ui-sdk-*']
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install clang-format 18
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-format-18
      - name: Format changed SDK sources
        run: |
          clang-format-18 -i src/sdk/soak_monitor.hpp src/sdk/sdk.hpp tests/unit/sdk_soak_test.cpp examples/sdk-consumer/main.cpp
      - name: Export exact formatted bytes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, subprocess
          for path in subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines():
              data = base64.b64encode(Path(path).read_bytes()).decode('ascii')
              for i, offset in enumerate(range(0, len(data), 1500)):
                  print(f'HUIFMT|{path}|{i}|{data[offset:offset+1500]}',flush=True)
              print(f'HUIEND|{path}|{len(data)}',flush=True)
          PY
